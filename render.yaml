services:
  - type: web
    name: anify-server
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: ADMIN_PASSWORD
        value: admin123 # You can override this in the Render dashboard env vars
      - key: AUTO_GIT_SYNC
        value: "true"
      - key: GITHUB_TOKEN
        sync: false  # Set this secret value in the Render dashboard
      - key: GITHUB_REPO
        value: satyakiran29/Anify_Server

  - type: cron
    name: anify-keep-alive
    runtime: node
    schedule: "*/13 * * * *" # Every 13 minutes (Render spin-down is 15 minutes)
    buildCommand: npm install
    startCommand: node src/scripts/keepAlive.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: anify-server
          property: host
