name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Run every 10 minutes to prevent Render spin-down (15-min limit)
  workflow_dispatch: # Enable manual triggering from the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Anify Server Stats Endpoint
        run: |
          # Replace the URL below with your actual deployed Render Web Service URL
          URL="https://anify-server.onrender.com/api/v1/wallpapers/stats"
          echo "Pinging $URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Response Status Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Server is awake!"
          else
            echo "Server returned status: $STATUS"
            exit 1
          fi
